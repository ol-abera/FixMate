# Full stack: PostgreSQL, Redis, the Django API (Daphne, HTTP + WebSockets) and nginx serving the React app.
#   cp .env.example .env   # then set SECRET_KEY and DATABASE_PASSWORD
#   docker compose up --build
# Open http://localhost:8080 (change with APP_PORT/APP_URL).

x-backend-env: &backend-env
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_NAME: ${DATABASE_NAME:-fixmate}
  DATABASE_USER: ${DATABASE_USER:-fixmate}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env (see .env.example)}
  REDIS_URL: redis://redis:6379/0
  FRONTEND_URL: ${APP_URL:-http://localhost:8080}
  CORS_ALLOWED_ORIGINS: ${APP_URL:-http://localhost:8080}
  CSRF_TRUSTED_ORIGINS: ${APP_URL:-http://localhost:8080}
  # Terminate TLS in front of nginx in production, then set this to True.
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
  MEDIA_ROOT: /app/media
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-FixMate <no-reply@fixmate.local>}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PAYMENTS_CURRENCY: ${PAYMENTS_CURRENCY:-usd}
  # Test-mode checkout without Stripe. Never enable on a deployment that takes real bookings.
  PAYMENTS_MOCK: ${PAYMENTS_MOCK:-False}
  SEED_DEMO: ${SEED_DEMO:-0}
  SEED_PASSWORD: ${SEED_PASSWORD:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-fixmate}
      POSTGRES_USER: ${DATABASE_USER:-fixmate}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro

volumes:
  pgdata:
  media:
  static:

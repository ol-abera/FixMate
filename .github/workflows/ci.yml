name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npx vite build

  backend:
    name: Backend (migrations check, Django tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixmate
          POSTGRES_PASSWORD: fixmate-ci
          POSTGRES_DB: fixmate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fixmate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DEBUG: "True"
      DATABASE_NAME: fixmate
      DATABASE_USER: fixmate
      DATABASE_PASSWORD: fixmate-ci
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Fail if models changed without a migration
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --parallel 1

  docker:
    name: Docker (build images, boot the stack, smoke test)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DATABASE_PASSWORD: fixmate-ci
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/explore | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/health/ | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/api/categories/ > /dev/null
          curl -fsS -o /dev/null http://localhost:8080/admin/login/
          curl -fsS -o /dev/null http://localhost:8080/static/admin/css/base.css
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
